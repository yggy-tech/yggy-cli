name: Release

# release-please keeps a release PR open with the version bump and changelog. Merging it tags the
# release and creates the GitHub release; GoReleaser then attaches the archives, the checksums and
# install.sh. It runs as a second job here because a tag made with GITHUB_TOKEN does not start
# other workflows. The sync (yggy-tech/yggdrasil) describes each merged sync by its real commits,
# which is what the changelog is made of.
on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    goreleaser:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
                  fetch-depth: 0
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - uses: goreleaser/goreleaser-action@v7
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
